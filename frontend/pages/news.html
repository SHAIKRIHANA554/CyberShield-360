<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber News - CyberShield 360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="/assets/css/main.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="page-header">
      <h1>Cyber Intelligence Feed</h1>
      <p>Read the latest breach reports, scams, and advisories curated by our research team.</p>
    </div>

    <div class="row g-4" id="newsList"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar(true);
    document.getElementById('sidebar-container').innerHTML = renderSidebar('news');
    initPage();

    async function loadNews() {
      showLoading();
      const result = await apiGet(ENDPOINTS.NEWS);
      hideLoading();
      const list = document.getElementById('newsList');
      if (!result.success) {
        list.innerHTML = '<div class="text-secondary">No news available.</div>';
        return;
      }
      list.innerHTML = (result.data.items || []).map(article => `
        <div class="col-lg-6">
          <a class="d-block h-100 text-decoration-none text-reset" href="/pages/content-detail.html?type=news&id=${encodeURIComponent(article._id)}">
            <div class="news-card glass-card h-100">
              <div class="news-img"><i class="fas fa-newspaper"></i></div>
              <div class="news-body">
                <span class="news-category">${article.category || 'Security'}</span>
                <h5>${article.title}</h5>
                <p class="text-secondary small">${article.summary || article.content?.slice(0, 140)}</p>
                <div class="d-flex justify-content-between align-items-center mt-3">
                  <span class="small text-secondary">${formatDate(article.created_at)}</span>
                  <span class="small text-secondary">By ${article.author || 'CyberShield'} · Read details</span>
                </div>
              </div>
            </div>
          </a>
        </div>
      `).join('');
    }
    loadNews();
  </script>
</body>
</html>
