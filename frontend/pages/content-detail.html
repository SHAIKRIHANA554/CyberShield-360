<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Details - CyberShield 360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="/assets/css/main.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="page-header">
      <a id="backToContent" class="small text-secondary text-decoration-none" href="/pages/news.html"><i class="fas fa-arrow-left me-1"></i>Back to feed</a>
      <h1 id="detailTitle" class="mt-3">Loading content</h1>
      <div id="detailMeta" class="small text-secondary"></div>
    </div>
    <article class="glass-card p-4 p-lg-5" id="detailContent">
      <p class="text-secondary mb-0">Loading the full note...</p>
    </article>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar(true);
    document.getElementById('sidebar-container').innerHTML = renderSidebar();
    initPage();

    const params = new URLSearchParams(window.location.search);
    const type = params.get('type');
    const contentId = params.get('id');
    const isNews = type === 'news';
    const endpoint = isNews ? ENDPOINTS.NEWS : ENDPOINTS.LEARNING;
    document.getElementById('backToContent').href = isNews ? '/pages/news.html' : '/pages/cyber-law.html';

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    async function loadContentDetail() {
      const title = document.getElementById('detailTitle');
      const meta = document.getElementById('detailMeta');
      const content = document.getElementById('detailContent');
      if (!contentId || !['news', 'law'].includes(type)) {
        title.textContent = 'Content not found';
        content.innerHTML = '<p class="text-secondary mb-0">The requested article or law entry is invalid.</p>';
        return;
      }

      showLoading();
      const result = await apiGet(`${endpoint}/${encodeURIComponent(contentId)}`);
      hideLoading();
      if (!result.success || !result.data) {
        title.textContent = 'Content unavailable';
        content.innerHTML = `<p class="text-secondary mb-0">${escapeHtml(result.message || 'This item could not be loaded.')}</p>`;
        return;
      }

      const item = result.data;
      document.title = `${item.title || 'Content Details'} - CyberShield 360`;
      title.textContent = item.title || 'Untitled';
      meta.textContent = [isNews ? (item.category || 'Security') : (item.category || 'Cyber Law'), item.author ? `By ${item.author}` : '', formatDate(item.created_at)].filter(Boolean).join(' · ');
      content.innerHTML = `
        ${item.summary ? `<p class="lead">${escapeHtml(item.summary)}</p>` : ''}
        <div class="text-secondary" style="white-space:pre-line">${escapeHtml(item.content || item.description || 'No additional details were provided.')}</div>
        ${item.tags?.length ? `<div class="d-flex flex-wrap gap-2 mt-4">${item.tags.map(tag => `<span class="badge bg-secondary bg-opacity-25 text-light">${escapeHtml(tag)}</span>`).join('')}</div>` : ''}
      `;
    }

    loadContentDetail();
  </script>
</body>
</html>
