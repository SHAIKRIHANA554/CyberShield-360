<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cyber Law - CyberShield 360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="/assets/css/main.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="page-header">
      <h1>Cyber Law & Updates</h1>
      <p>Review government advisories, CERT-In updates, privacy regulations, and legal guidance.</p>
    </div>
    <div class="row g-4" id="lawList"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar(true);
    document.getElementById('sidebar-container').innerHTML = renderSidebar('cyber-law');
    initPage();
    async function loadLaw() {
      showLoading();
      const result = await apiGet(ENDPOINTS.CYBER_LAW);
      hideLoading();
      const list = document.getElementById('lawList');
      if (!result.success) {
        list.innerHTML = '<div class="text-secondary">No legal updates available.</div>';
        return;
      }
      list.innerHTML = (result.data.items || []).map(item => `
        <div class="col-lg-6">
          <a class="d-block h-100 text-decoration-none text-reset" href="/pages/content-detail.html?type=law&id=${encodeURIComponent(item._id)}">
            <div class="glass-card p-4 h-100">
              <div class="d-flex justify-content-between align-items-start mb-3">
                <h5>${item.title}</h5>
                <span class="badge bg-danger bg-opacity-25 text-danger">${item.category || 'Policy'}</span>
              </div>
              <p class="text-secondary">${item.description || item.content?.slice(0, 140)}</p>
              <span class="small text-danger">Read full note <i class="fas fa-arrow-right ms-1"></i></span>
            </div>
          </a>
        </div>
      `).join('');
    }
    loadLaw();
  </script>
</body>
</html>
