<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CyberShield 360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card" data-aos="fade-up">
      <div class="text-center mb-4">
        <div class="shield-icon d-inline-flex mb-3" style="width:56px;height:56px;border-radius:14px"><i class="fas fa-shield-alt fa-lg"></i></div>
        <h3 class="fw-bold">Welcome Back</h3>
        <p class="text-secondary small">Sign in to CyberShield 360</p>
      </div>
      <form id="loginForm" class="form-cyber">
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>
        <div class="d-flex justify-content-between mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember">
            <label class="form-check-label text-secondary small" for="remember">Remember me</label>
          </div>
          <a href="/pages/forgot-password.html" class="small">Forgot Password?</a>
        </div>
        <button type="submit" class="btn-cyber w-100 mb-3"><i class="fas fa-sign-in-alt me-2"></i>Sign In</button>
        <p class="text-center text-secondary small mb-0">Don't have an account? <a href="/pages/register.html">Register</a></p>
        <hr class="border-secondary my-3" style="opacity:0.2">
        <p class="text-center small"><a href="/pages/admin/login.html" class="text-secondary"><i class="fas fa-lock me-1"></i>Admin Login</a></p>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = '/pages/dashboard.html';
    document.getElementById('loginForm').addEventListener('submit', handleLogin);
  </script>
</body>
</html>
