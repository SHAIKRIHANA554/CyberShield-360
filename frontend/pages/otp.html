<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification - CyberShield 360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <i class="fas fa-shield-alt fa-2x text-danger mb-3"></i>
        <h3 class="fw-bold">Verify OTP</h3>
        <p class="text-secondary small">Enter the OTP sent to your email and set a new password</p>
      </div>
      <form id="otpForm" class="form-cyber">
        <div class="mb-3">
          <label class="form-label">OTP Code</label>
          <input type="text" class="form-control text-center" id="otp" placeholder="6-digit OTP" maxlength="6" required style="font-size:1.5rem;letter-spacing:8px">
        </div>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" class="form-control" id="password" placeholder="New password" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirm_password" placeholder="Confirm password" required>
        </div>
        <button type="submit" class="btn-cyber w-100 mb-3"><i class="fas fa-check me-2"></i>Reset Password</button>
        <p class="text-center text-secondary small mb-0"><a href="/pages/login.html">Back to Login</a></p>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    if (!sessionStorage.getItem('reset_email')) window.location.href = '/pages/forgot-password.html';
    document.getElementById('otpForm').addEventListener('submit', handleVerifyOtp);
  </script>
</body>
</html>
