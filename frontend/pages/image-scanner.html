<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Scanner - CyberShield 360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="/assets/css/main.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="page-header">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div>
          <h1>Image & Camera Scanner</h1>
          <p>Upload screenshots, photos, or QR-based images to inspect them for fraud and scam indicators.</p>
        </div>
        <button class="btn btn-outline-light btn-sm" onclick="goBack()"><i class="fas fa-arrow-left me-2"></i>Back</button>
      </div>
    </div>
    <div class="scanner-container glass-card p-4">
      <div class="upload-zone" id="uploadZone">
        <i class="fas fa-cloud-upload-alt"></i>
        <h4 class="mb-2">Drop image here or click to upload</h4>
        <p class="text-secondary mb-3">PNG, JPG, JPEG, WEBP, BMP</p>
        <input type="file" id="imageInput" accept="image/*" hidden />
        <button class="btn-cyber"><i class="fas fa-camera me-2"></i>Select Image</button>
      </div>
      <div id="previewContainer" class="mt-4" style="display:none"></div>
      <div id="resultContainer"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar(isLoggedIn());
    document.getElementById('sidebar-container').innerHTML = renderSidebar('image-scanner');
    initPage();

    let selectedFile = null;
    setupFileUpload('uploadZone', 'imageInput', file => {
      selectedFile = file;
      previewImage(file, 'previewContainer');
      analyzeImage(file);
    });

    async function analyzeImage(file) {
      if (!file) return;
      const formData = new FormData();
      formData.append('image', file);
      showLoading();
      const result = await apiUpload(ENDPOINTS.SCAN_IMAGE, formData);
      hideLoading();
      if (result.success) {
        renderScanResult('resultContainer', result.data);
      } else {
        Swal.fire({ icon: 'error', title: 'Scan failed', text: result.message, background: '#141A26', color: '#fff' });
      }
    }
  </script>
</body>
</html>
