<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threat Reports - CyberShield 360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="/assets/css/main.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="page-header">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div>
          <h1>Threat Reports</h1>
          <p>Download and review a history of your cybersecurity assessments.</p>
        </div>
        <button class="btn btn-outline-light btn-sm" onclick="goBack()"><i class="fas fa-arrow-left me-2"></i>Back</button>
      </div>
    </div>
    <div class="glass-card p-4">
      <div id="reportsList"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar(isLoggedIn());
    document.getElementById('sidebar-container').innerHTML = renderSidebar('reports');
    initPage();
    async function loadReports() {
      showLoading();
      const result = await apiGet(ENDPOINTS.REPORTS);
      hideLoading();
      const list = document.getElementById('reportsList');
      const items = (result.success && result.data.items?.length) ? result.data.items : [
        { _id: 'demo_report_1', scan_type: 'URL Scan', threat_type: 'Phishing Link', threat_level: 'danger', created_at: new Date().toISOString() },
        { _id: 'demo_report_2', scan_type: 'SMS Scan', threat_type: 'OTP Scam', threat_level: 'warning', created_at: new Date().toISOString() },
        { _id: 'demo_report_3', scan_type: 'Image OCR', threat_type: 'Legitimate Notice', threat_level: 'safe', created_at: new Date().toISOString() }
      ];
      list.innerHTML = `<table class="table-cyber">
        <thead><tr><th>Type</th><th>Threat</th><th>Level</th><th>Time</th><th>Action</th></tr></thead>
        <tbody>${items.map(item => `
          <tr>
            <td><i class="fas fa-shield-alt text-danger me-2"></i>${item.scan_type || 'Scan'}</td>
            <td>${item.threat_type || 'None'}</td>
            <td>${getThreatBadge(item.threat_level || 'safe')}</td>
            <td>${formatDate(item.created_at)}</td>
            <td><button class="btn-cyber btn-sm" onclick="downloadReport('${item._id}')"><i class="fas fa-file-pdf me-1"></i>Download PDF</button></td>
          </tr>
        `).join('')}</tbody></table>`;
    }
    loadReports();
  </script>
</body>
</html>
