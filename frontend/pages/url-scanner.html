<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Scanner - CyberShield 360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link href="/assets/css/main.css" rel="stylesheet" />
</head>
<body>
  <div id="navbar-container"></div>
  <div id="sidebar-container"></div>
  <main class="main-content">
    <div class="page-header">
      <div class="d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div>
          <h1>URL Threat Analysis</h1>
          <p>Paste a URL and receive an instant phishing and malicious-link assessment.</p>
        </div>
        <button class="btn btn-outline-light btn-sm" onclick="goBack()"><i class="fas fa-arrow-left me-2"></i>Back</button>
      </div>
    </div>
    <div class="scanner-container glass-card p-4">
      <form id="urlForm" class="form-cyber">
        <label class="form-label">Website URL</label>
        <input type="url" class="form-control" id="url" placeholder="https://example.com" required />
        <button class="btn-cyber mt-3" type="submit"><i class="fas fa-search me-2"></i>Analyze URL</button>
      </form>
      <div id="resultContainer" class="mt-4"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script src="/assets/js/components.js"></script>
  <script>
    document.getElementById('navbar-container').innerHTML = renderNavbar(isLoggedIn());
    document.getElementById('sidebar-container').innerHTML = renderSidebar('url-scanner');
    initPage();
    document.getElementById('urlForm').addEventListener('submit', async e => {
      e.preventDefault();
      const url = document.getElementById('url').value;
      showLoading();
      const result = await apiPost(ENDPOINTS.SCAN_URL, { url });
      hideLoading();
      if (result.success) {
        renderScanResult('resultContainer', result.data);
      } else {
        Swal.fire({ icon: 'error', title: 'Analysis failed', text: result.message, background: '#141A26', color: '#fff' });
      }
    });
  </script>
</body>
</html>
