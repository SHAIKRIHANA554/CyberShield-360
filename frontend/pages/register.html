<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - CyberShield 360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="shield-icon d-inline-flex mb-3" style="width:56px;height:56px;border-radius:14px"><i class="fas fa-shield-alt fa-lg"></i></div>
        <h3 class="fw-bold">Create Account</h3>
        <p class="text-secondary small">Join CyberShield 360 today</p>
      </div>
      <form id="registerForm" class="form-cyber">
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" placeholder="John Doe" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="email" placeholder="you@example.com" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Min 8 chars, uppercase, lowercase, digit" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirm_password" placeholder="Confirm password" required>
        </div>
        <button type="submit" class="btn-cyber w-100 mb-3"><i class="fas fa-user-plus me-2"></i>Create Account</button>
        <p class="text-center text-secondary small mb-0">Already have an account? <a href="/pages/login.html">Sign In</a></p>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    if (isLoggedIn()) window.location.href = '/pages/dashboard.html';
    document.getElementById('registerForm').addEventListener('submit', handleRegister);
  </script>
</body>
</html>
