<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - CyberShield 360</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="/assets/css/main.css" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="text-center mb-4">
        <div class="shield-icon d-inline-flex mb-3" style="width:56px;height:56px;border-radius:14px;background:#1a1a2e"><i class="fas fa-user-shield fa-lg"></i></div>
        <h3 class="fw-bold">Admin Portal</h3>
        <p class="text-secondary small">Restricted access - Administrators only</p>
      </div>
      <form id="adminLoginForm" class="form-cyber">
        <div class="mb-3">
          <label class="form-label">Admin Email</label>
          <input type="email" class="form-control" id="email" placeholder="admin@cybershield360.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="password" placeholder="Admin password" required>
        </div>
        <button type="submit" class="btn-cyber w-100 mb-3"><i class="fas fa-lock me-2"></i>Admin Sign In</button>
        <p class="text-center text-secondary small mb-0"><a href="/pages/login.html"><i class="fas fa-arrow-left me-1"></i>User Login</a></p>
      </form>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/utils.js"></script>
  <script>
    document.getElementById('adminLoginForm').addEventListener('submit', handleAdminLogin);
  </script>
</body>
</html>
